{% extends "base.html" %}

{% block title %}CampusConnect - Sign Up{% endblock %}

{% block footer %}Copyright by CIT-U{% endblock %}

{% block content %}
<h2>Log in</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
